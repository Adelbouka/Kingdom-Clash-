name: Unzip game
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          shopt -s nullglob
          z=(*.zip)
          if [ ${#z[@]} -gt 0 ]; then
            for f in "${z[@]}"; do unzip -o "$f" -d .; rm "$f"; done
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Extract game files"
            git push
          fi
