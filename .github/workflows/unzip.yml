name: Unzip game
on:
  push:
    paths: ['kingdom-clash.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          if [ -f kingdom-clash.zip ]; then
            unzip -o kingdom-clash.zip -d .
            rm kingdom-clash.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Extract game files"
            git push
          fi
